<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Matcher Test Bench | Aggregator Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0d1322 100%);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.06);
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --success: #10b981;
      --warning: #f59e0b;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .badge-bar {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .pill {
      font-size: 0.75rem;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-family: var(--font-mono);
    }

    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"], select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: var(--font-sans);
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .exp-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .exp-row input[type="text"] {
      flex: 1;
    }

    .exp-row input[type="number"] {
      width: 80px;
      padding: 0.75rem 0.5rem;
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none;
      color: #fff;
      padding: 0.9rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .results-count {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .results-count strong {
      color: var(--text-main);
    }

    .toggle-json {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: var(--font-mono);
    }

    .toggle-json:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .job-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .job-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.2s ease;
      position: relative;
    }

    .job-card:hover {
      background: var(--card-hover);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }

    .job-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .job-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }

    .job-title:hover {
      color: var(--accent-primary);
    }

    .score-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--success);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    .score-badge.medium {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: var(--warning);
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .job-meta-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .meta-tag {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .job-desc {
      font-size: 0.88rem;
      color: #d1d5db;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .reasons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .reason-pill {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.04);
      color: #9ca3af;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .apply-btn {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: #a5b4fc;
      text-decoration: none;
      transition: color 0.2s;
    }

    .apply-btn:hover {
      color: #fff;
      text-decoration: underline;
    }

    pre#jsonOutput {
      background: #090d16;
      border: 1px solid var(--card-border);
      padding: 1rem;
      border-radius: 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #a5b4fc;
      max-height: 500px;
      overflow-y: auto;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Job Matcher Test Bench</h1>
      <p>Node.js + TypeScript Express Aggregator Service</p>
      <div class="badge-bar">
        <span class="pill">POST /api/search-jobs</span>
        <span class="pill">Render Ready</span>
        <span class="pill">RSS &amp; API Handlers</span>
      </div>
    </header>

    <div class="grid">
      <!-- Search Form -->
      <div class="card">
        <form id="searchForm">
          <div class="form-group">
            <label for="skills">Skills (comma separated)</label>
            <input type="text" id="skills" value="flutter, dart, firebase, mobile" placeholder="e.g. react, node.js, typescript" required />
          </div>

          <div class="form-group">
            <label>Work Preference</label>
            <select id="workPreference">
              <option value="remote" selected>Remote</option>
              <option value="on-site">On-site</option>
              <option value="hybrid">Hybrid</option>
              <option value="any">Any</option>
            </select>
          </div>

          <div class="form-group">
            <label for="locations">Locations (comma separated)</label>
            <input type="text" id="locations" value="Accra, Ghana, Remote" placeholder="e.g. Accra, London, Remote" />
          </div>

          <div class="form-group">
            <label>Experience (Optional)</label>
            <div id="expContainer">
              <div class="exp-row">
                <input type="text" class="exp-title" value="Mobile Developer" placeholder="Title" />
                <input type="number" class="exp-years" value="2" placeholder="Years" min="0" />
              </div>
            </div>
            <button type="button" class="btn-secondary" id="addExpBtn">+ Add Experience</button>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span>Search &amp; Score Jobs</span>
          </button>
        </form>
      </div>

      <!-- Results View -->
      <div>
        <div class="results-header">
          <div class="results-count" id="resultsCount">Ready to search</div>
          <button class="toggle-json" id="toggleJsonBtn">Show Raw JSON</button>
        </div>

        <pre id="jsonOutput"></pre>

        <div class="job-list" id="jobList">
          <div class="empty-state">
            Fill out candidate profile and click "Search &amp; Score Jobs" to view live matches.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const searchForm = document.getElementById('searchForm');
    const expContainer = document.getElementById('expContainer');
    const addExpBtn = document.getElementById('addExpBtn');
    const submitBtn = document.getElementById('submitBtn');
    const jobList = document.getElementById('jobList');
    const jsonOutput = document.getElementById('jsonOutput');
    const resultsCount = document.getElementById('resultsCount');
    const toggleJsonBtn = document.getElementById('toggleJsonBtn');

    let showJson = false;
    let lastResponse = null;

    // Add experience row
    addExpBtn.addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'exp-row';
      row.innerHTML = `
        <input type="text" class="exp-title" placeholder="Title (e.g. Frontend Dev)" />
        <input type="number" class="exp-years" placeholder="Years" min="0" value="1" />
      `;
      expContainer.appendChild(row);
    });

    // Toggle JSON View
    toggleJsonBtn.addEventListener('click', () => {
      showJson = !showJson;
      toggleJsonBtn.textContent = showJson ? 'Show Cards View' : 'Show Raw JSON';
      jsonOutput.style.display = showJson ? 'block' : 'none';
      jobList.style.display = showJson ? 'none' : 'flex';
    });

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const skills = document.getElementById('skills').value
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);

      const locations = document.getElementById('locations').value
        .split(',')
        .map(l => l.trim())
        .filter(Boolean);

      const workPreference = document.getElementById('workPreference').value;

      const expRows = expContainer.querySelectorAll('.exp-row');
      const experience = [];
      expRows.forEach(row => {
        const title = row.querySelector('.exp-title').value.trim();
        const years = parseInt(row.querySelector('.exp-years').value, 10) || 0;
        if (title) {
          experience.push({ title, years });
        }
      });

      const payload = {
        skills,
        experience,
        locations,
        workPreference,
      };

      // UI Loading State
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Searching Platforms...';
      resultsCount.innerHTML = 'Fetching from WeWorkRemotely &amp; RemoteOK...';

      try {
        const res = await fetch('/api/search-jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }

        const data = await res.json();
        lastResponse = data;
        jsonOutput.textContent = JSON.stringify(data, null, 2);

        renderJobs(data);
      } catch (err) {
        console.error(err);
        jobList.innerHTML = `<div class="empty-state" style="color:#ef4444">Error fetching jobs: ${err.message}</div>`;
        resultsCount.textContent = 'Error occurred';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Search &amp; Score Jobs</span>';
      }
    });

    function renderJobs(data) {
      const { count, totalFetched, jobs } = data;
      resultsCount.innerHTML = `Found <strong>${count}</strong> matches (from ${totalFetched} raw listings)`;

      if (!jobs || jobs.length === 0) {
        jobList.innerHTML = '<div class="empty-state">No matching jobs found for the selected skills/locations.</div>';
        return;
      }

      jobList.innerHTML = jobs.map(job => {
        const scoreClass = job.score >= 0.7 ? 'score-badge' : 'score-badge medium';
        const scorePercent = Math.round(job.score * 100);

        const reasonsHtml = (job.matchReasons || [])
          .map(r => `<span class="reason-pill">${escapeHtml(r)}</span>`)
          .join('');

        return `
          <div class="job-card">
            <div class="job-top">
              <a href="${escapeHtml(job.url)}" target="_blank" rel="noopener noreferrer" class="job-title">
                ${escapeHtml(job.title)}
              </a>
              <div class="${scoreClass}">Match: ${scorePercent}%</div>
            </div>
            
            <div class="job-meta">
              <span class="job-meta-item">🏢 ${escapeHtml(job.company)}</span>
              <span class="job-meta-item">📍 ${escapeHtml(job.location)}</span>
              <span class="meta-tag">Source: ${escapeHtml(job.source)}</span>
              ${job.remote ? '<span class="meta-tag" style="color:#10b981;background:rgba(16,185,129,0.1)">Remote</span>' : ''}
            </div>

            <div class="job-desc">${escapeHtml(job.description)}</div>

            <div class="reasons">${reasonsHtml}</div>

            <a href="${escapeHtml(job.url)}" target="_blank" rel="noopener noreferrer" class="apply-btn">
              View &amp; Apply &rarr;
            </a>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
